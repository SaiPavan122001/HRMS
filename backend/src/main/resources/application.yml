spring:
  application:
    name: hrms-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${DATABASE_USERNAME:hrms}
    password: ${DATABASE_PASSWORD:hrms}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: hrms-notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.hrms.events
    topic:
      hrms-events: hrms.events
      hrms-events-dlt: hrms.events.dlt
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@example.com}
    from-name: ${MAIL_FROM_NAME:HRMS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
            scope: [openid, profile, email]
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            redirect-uri: ${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/github}
            scope: [read:user, user:email]
        provider:
          github:
            user-name-attribute: id
  jackson:
    serialization:
      write-dates-as-timestamps: false

hrms:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:168h}
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:true}

server:
  port: 8081
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: hrms

logging:
  level:
    com.hrms: INFO
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
